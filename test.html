<div class="form-container">
            <form id="demo-form">
                <div class="form-group">
                    <label for="name">Prénom & Nom</label>
                    <input type="text" id="name" name="name" required>
                </div>
    
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
    
                <div class="form-group">
                    <label for="instagram">CP / Ville</label>
                    <input type="text" id="instagram" name="instagram" required>
                </div>
    
                <div class="form-group">
                    <label for="release-title">Tél.</label>
                    <input type="text" id="release-title" name="release-title" required>
                </div>
    
                <div class="form-group">
                    <label for="release-date">Quel jour ?</label>
                    <input type="date" id="release-date" name="release-date" required>
                </div>
    
                <div class="form-group">
                    <label for="about">Votre Message</label>
                    <textarea id="about" name="about" required></textarea>
                </div>
    
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="confirm" name="confirm" required>
                        j'accepte les conditions d'utilisation
                    </label>
                </div>
    
                <button type="submit" class="submit-btn">Envoyer</button>
            </form>
